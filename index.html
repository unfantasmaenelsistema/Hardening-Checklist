<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardening Checklist · Un Fantasma en el Sistema</title>
<meta name="description" content="Checklist de bastionado (hardening) de Windows y Linux: 80 medidas con su comando o configuración, criticidad, progreso guardado y exportación a TXT, HTML y PDF. ES/EN.">
<link rel="icon" href="icono.png">
<script>
  // Tema antes de pintar, para que no parpadee
  (function(){var t=null;try{t=localStorage.getItem('hc_theme');}catch(e){}
  if(t)t=JSON.parse(t);
  if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="logo" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">
    <img src="icono.png" alt="Un Fantasma en el Sistema">
    <div class="logo-text">
      <h1>Hardening <span>Checklist</span></h1>
      <small>unfantasmaenelsistema.com</small>
    </div>
  </a>
  <div class="header-controls">
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="searchInput" autocomplete="off" data-i18n-ph="searchPh">
    </div>
    <div class="btn-group" id="osFilter">
      <button type="button" class="pill pill-os active-all" data-os="all" data-i18n="all"></button>
      <button type="button" class="pill pill-os" data-os="windows">⊞ Win</button>
      <button type="button" class="pill pill-os" data-os="linux">🐧 Linux</button>
    </div>
    <div class="btn-group" id="critFilter">
      <button type="button" class="pill pill-crit" data-crit="Alta" aria-pressed="false"></button>
      <button type="button" class="pill pill-crit" data-crit="Media" aria-pressed="false"></button>
      <button type="button" class="pill pill-crit" data-crit="Baja" aria-pressed="false"></button>
    </div>
    <button type="button" class="btn-action btn-export" id="exportTxt">↓ TXT</button>
    <button type="button" class="btn-action btn-html" id="exportHtml">↓ HTML</button>
    <button type="button" class="btn-action btn-pdf" id="exportPdf">↓ PDF</button>
    <button type="button" class="btn-action btn-theme" id="themeBtn"></button>
    <button type="button" class="btn-action btn-theme" id="langBtn">EN</button>
    <button type="button" class="btn-action btn-reset" id="resetBtn"></button>
  </div>
</header>

<div class="notice" id="notice" role="note">
  <span data-i18n-html="notice"></span>
  <button type="button" class="notice-close" id="noticeClose" data-i18n="understood"></button>
</div>

<div class="progress-bar-wrap">
  <div class="prog-os">
    <span class="prog-label win">⊞ WINDOWS</span>
    <div class="prog-track"><div class="prog-fill win" id="winFill"></div></div>
    <span class="prog-pct" id="winPct">0%</span>
  </div>
  <div class="prog-os">
    <span class="prog-label linux">🐧 LINUX</span>
    <div class="prog-track"><div class="prog-fill linux" id="linuxFill"></div></div>
    <span class="prog-pct" id="linuxPct">0%</span>
  </div>
</div>

<main id="mainGrid">
  <section class="os-panel" id="winPanel" aria-labelledby="winTitle">
    <div class="os-header">
      <div class="os-icon win">⊞</div>
      <h2 class="os-title win" id="winTitle">Windows</h2>
      <span class="os-count" id="winCount"></span>
    </div>
    <div id="winContent"></div>
    <div class="no-results" id="winNoResults" data-i18n="noResults"></div>
  </section>
  <section class="os-panel" id="linuxPanel" aria-labelledby="linuxTitle">
    <div class="os-header">
      <div class="os-icon linux">🐧</div>
      <h2 class="os-title linux" id="linuxTitle">Linux</h2>
      <span class="os-count" id="linuxCount"></span>
    </div>
    <div id="linuxContent"></div>
    <div class="no-results" id="linuxNoResults" data-i18n="noResults"></div>
  </section>
</main>

<footer class="footer">
  <span>Hardening Checklist · <a href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">Un Fantasma en el Sistema</a></span>
  <span><a href="https://github.com/unfantasmaenelsistema/Hardening-Checklist" target="_blank" rel="noopener" data-i18n="source"></a> · MIT</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
